name: Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/openlinkos/harbor-for-deepseek:latest
            ghcr.io/openlinkos/harbor-for-deepseek:${{ github.sha }}
            ghcr.io/openlinkos/harbor-for-deepseek:${{ github.ref_name }}
