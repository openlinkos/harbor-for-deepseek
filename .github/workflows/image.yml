name: Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "value=$(node scripts/release-meta.mjs)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            DEEPAPI_VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/openlinkos/deepapi:latest
            ghcr.io/openlinkos/deepapi:${{ github.sha }}
            ghcr.io/openlinkos/deepapi:${{ github.ref_name }}
            ghcr.io/openlinkos/harbor-for-deepseek:latest
            ghcr.io/openlinkos/harbor-for-deepseek:${{ github.sha }}
            ghcr.io/openlinkos/harbor-for-deepseek:${{ github.ref_name }}
