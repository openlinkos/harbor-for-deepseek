name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://harbor:harbor@localhost:5432/harbor
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harbor
          POSTGRES_PASSWORD: harbor
          POSTGRES_DB: harbor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harbor -d harbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm scan-secrets
      - run: pnpm build
      - run: pnpm --filter @harbor/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: node scripts/prepare-mobile.mjs --lan
      - run: pnpm --filter @harbor/web exec playwright test -c playwright.android.config.ts
      - run: pnpm --filter @harbor/server build
      - run: pnpm e2e:server

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: DOCKER_BUILDKIT=1 docker build -f deploy/Dockerfile -t harbor:ci .

  server-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POSTGRES_PASSWORD: e2e-db-password-0123456789abcd
      KEY_ENCRYPTION_SECRET: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      BOOTSTRAP_TOKEN: e2e-bootstrap-token-0123456789
      COMPOSE_PROJECT_NAME: harbor
    steps:
      - uses: actions/checkout@v4
      - name: Start Compose
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
      - name: Create an admin, invite a user, chat, and sync
        run: node apps/server/e2e/run.mjs
      - name: App logs omit the key and the message
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color harbor > /tmp/harbor-logs.txt
          if grep -F 'sk-mockpoolsecretvalue' /tmp/harbor-logs.txt; then
            echo 'log contained the upstream key' >&2
            exit 1
          fi
          if grep -F 'sync-check-phrase' /tmp/harbor-logs.txt; then
            echo 'log contained message text' >&2
            exit 1
          fi
      - name: Stop Compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Use the preinstalled Android SDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install the Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/prepare-mobile.mjs --lan
      - run: pnpm --filter @harbor/mobile exec cap sync android
      - name: Assemble a debug APK
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: harbor-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/prepare-mobile.mjs
      - run: pnpm --filter @harbor/mobile exec cap sync ios
      - name: Build an unsigned simulator app
        working-directory: apps/mobile/ios/App
        run: >
          xcodebuild
          -workspace App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
