name: Web image

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/**"
      - "deploy/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".npmrc"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/web-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/openlinkos/deepapi-web
            ghcr.io/openlinkos/harbor-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value={{date 'YYYYMMDDHHmmss' tz='UTC'}}-{{sha}},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Apply when HARBOR_KUBECONFIG is set
        env:
          KUBECONFIG_VALUE: ${{ secrets.HARBOR_KUBECONFIG }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$KUBECONFIG_VALUE" ]; then
            echo "HARBOR_KUBECONFIG is absent; skipping deploy."
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_VALUE" > "$HOME/.kube/config"
          if ! grep -q 'apiVersion:' "$HOME/.kube/config"; then
            base64 -d "$HOME/.kube/config" > "$HOME/.kube/config.decoded"
            mv "$HOME/.kube/config.decoded" "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          export KUBECONFIG="$HOME/.kube/config"
          short="$(printf '%s' "$SHORT_SHA" | cut -c1-7)"
          kubectl apply -k deploy/web/k8s
          kubectl -n harbor set image deployment/harbor-web web="ghcr.io/openlinkos/deepapi-web:sha-${short}"
          kubectl -n harbor rollout status deployment/harbor-web --timeout=180s
