apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbor
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: ghcr.io/openlinkos/deepapi-web
    newTag: latest
# Default ingress class. Change `value` for another controller.
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: harbor-web
    patch: |-
      - op: add
        path: /spec/ingressClassName
        value: nginx
