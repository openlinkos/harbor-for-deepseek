apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-web
  labels:
    app.kubernetes.io/name: harbor-web
spec:
  rules:
    - host: hfd.linkos.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbor-web
                port:
                  name: http
  # TLS is optional. Cloudflare terminates HTTPS in front of this ingress.
  # tls:
  #   - hosts: [hfd.linkos.org]
  #     secretName: harbor-web-tls
