apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-web
  labels:
    app.kubernetes.io/name: harbor-web
spec:
  rules:
    - host: deepapi.linkos.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harbor-web
                port:
                  name: http
  # Public TLS terminates at GoEdge, which manages the certificate.
  # Cloudflare DNS for this host is a DNS-only CNAME to 70c9d096.quic.ing.
  # This Ingress is the origin and does not hold the public certificate.
  # tls:
  #   - hosts: [deepapi.linkos.org]
  #     secretName: harbor-web-tls
