worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr "$request" $status $body_bytes_sent';
  access_log /tmp/access.log main;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json font/woff font/woff2;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080 default_server;
    server_name deepapi.linkos.org _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      include /etc/nginx/security-headers.conf;
      return 200 'ok\n';
    }

    location = / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files /index.html =404;
    }

    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    location = /LICENSE {
      default_type text/plain;
      include /etc/nginx/security-headers.conf;
    }

    location = /NOTICE {
      default_type text/plain;
      include /etc/nginx/security-headers.conf;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/ /index.html;
    }
  }

  # hfd.linkos.org -> deepapi.linkos.org 301 is temporarily disabled until
  # deepapi.linkos.org is served at the edge (GoEdge site 109). Until then
  # hfd.linkos.org falls through to the default server and serves the app.
}
