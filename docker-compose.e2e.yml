# Used by CI. The mock stands in for the DeepSeek API.

services:
  mock:
    image: node:22-alpine
    command: ["node", "/opt/mock-deepseek.mjs"]
    volumes:
      - ./apps/server/e2e/mock-deepseek.mjs:/opt/mock-deepseek.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  deepapi:
    environment:
      DEEPSEEK_API_ORIGIN: http://mock:8081
    depends_on:
      db:
        condition: service_healthy
      mock:
        condition: service_healthy
